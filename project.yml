# XcodeGen specification — the single source of truth for the Xcode project.
# Run `make generate` after editing. The generated NestSuite.xcodeproj is not committed.
name: NestSuite
options:
  bundleIdPrefix: io.github.brommet87
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Ad-hoc signing for local development. Release builds are signed with a
    # Developer ID in CI once one is configured (see docs/RELEASING.md).
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

packages:
  NestKit:
    path: Packages/NestKit

targets:
  NestSuite:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: NestKit
        product: NestCore
      - package: NestKit
        product: NestDesign
      - package: NestKit
        product: NestVirtualization
      - package: NestKit
        product: NestImages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.brommet87.NestSuite
        PRODUCT_NAME: NestSuite
        CODE_SIGN_ENTITLEMENTS: App/NestSuite.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NestSuite
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 NestSuite contributors · GPL-3.0-or-later"
    scheme:
      testTargets:
        - NestSuiteTests
      gatherCoverageData: true

  NestSuiteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: NestSuite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NestSuite.app/Contents/MacOS/NestSuite"
