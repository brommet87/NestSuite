name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could NestSuite help? GUI, CLI and Nestfile aspects welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
