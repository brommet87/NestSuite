name: Bug report
description: Something doesn’t work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Security issues go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NestSuite version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 27.0, MacBook Pro M5
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or `nestctl … --json` output
      render: shell
