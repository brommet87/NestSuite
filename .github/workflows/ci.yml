name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install swiftlint swiftformat
      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging
      - name: SwiftFormat
        run: swiftformat --lint .

  package-tests:
    name: NestKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test --package-path Packages/NestKit --parallel

  app:
    name: App build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild -project NestSuite.xcodeproj -scheme NestSuite -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test -quiet
